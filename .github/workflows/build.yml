name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - run: gradle build
        working-directory: "spotify-control (1)/spotify-control"
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl-jar
          path: "spotify-control (1)/spotify-control/build/libs/*.jar"
